<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAUNCH — Kinetic Studio</title>
<meta name="description" content="A code-only motion graphics trailer. Every frame and every sound is generated live.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- FONTS: keep in sync with `fonts` in js/trailer.js. Display font should be variable (wght, ideally wdth). -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=block" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="viewport">
  <div id="stage">
    <div id="bg"></div>
    <div id="wipe"></div>
    <div id="camera"><canvas id="fx" width="1920" height="1080"></canvas></div>
    <div class="bar" id="bar-top"></div>
    <div class="bar" id="bar-bot"></div>
    <div id="hud" class="mono" aria-hidden="true">
      <i class="crop tl"></i><i class="crop tr"></i><i class="crop bl"></i><i class="crop br"></i>
      <div class="hud-tl"><span class="rec"></span>REC <span class="dim">/</span> <span id="hud-brand"></span></div>
      <div class="hud-tr" id="hud-scene">&nbsp;</div>
      <div class="hud-bl">TC <span id="hud-tc">00:00:00:00</span></div>
      <div class="hud-br">SC <span id="hud-num">00</span>/<span id="hud-total">00</span> <span class="dim">·</span> 24 FPS <span class="dim">·</span> 1920×1080</div>
    </div>
    <div id="flash"></div>
    <div id="vignette"></div>
    <div id="grain"></div>
  </div>
</div>

<div id="intro">
  <a id="intro-back" class="back mono" hidden></a>
  <div class="intro-inner">
    <div class="intro-mark"><i class="m-c"></i><i class="m-s"></i><i class="m-t"></i></div>
    <h1 class="intro-title v" id="intro-title"></h1>
    <p class="intro-sub" id="intro-sub"></p>
    <button id="play" aria-label="Reproducir tráiler" disabled>
      <span class="play-ring"></span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6L19 12z"/></svg>
    </button>
    <p class="intro-state" id="intro-state">CARGANDO</p>
  </div>
  <p class="intro-keys" id="intro-keys"></p>
</div>

<div id="end"><div class="end-row"><button id="replay">↺&nbsp; REPLAY</button><a id="end-back" class="end-back" hidden></a></div></div>

<div id="ui">
  <div id="ui-state" class="mono"></div>
  <div id="progress"><i></i></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/MorphSVGPlugin.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/DrawSVGPlugin.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrambleTextPlugin.min.js"></script>
<!-- THREE (for recipes-3d.js):
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
-->

<script src="js/audio.js"></script>
<script src="js/engine.js"></script>
<script src="js/recipes.js"></script>
<script src="js/recipes-type.js"></script>
<script src="js/recipes-glitch.js"></script>
<script src="js/recipes-liquid.js"></script>
<script src="js/recipes-data.js"></script>
<script src="js/recipes-cosmos.js"></script>
<script src="js/recipes-swarm.js"></script>
<!-- 3D recipes need Three.js r147: uncomment the THREE block above (only trailers that use them pay the download) -->
<script src="js/recipes-3d.js"></script>
<script src="js/recipes-city.js"></script>
<script src="js/data/land.js"></script>
<script src="js/recipes-globe.js"></script>
<script src="js/recipes-ui.js"></script>
<script src="js/trailer.js"></script>
</body>
</html>
